name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rocq:
    name: Rocq proofs
    # Skipped while iterating on the talk; run it by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `mise run build` runs dune in the rocq/rocq-prover image (the default
      # ROCQ_BACKEND), exactly as it does locally; no tool to install.
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Check the proofs
        env:
          MISE_TASK_RUN_AUTO_INSTALL: false
        run: mise run build
      - name: Generated opam file is up to date
        run: git diff --exit-code -- rocq-solid.opam

  slides:
    name: Slides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: typst
      - name: Compile all decks
        run: mise run slides-all
      - uses: actions/upload-artifact@v4
        with:
          name: decks
          path: site/decks/*.pdf

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [slides]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: typst
      - name: Compile decks into the site
        run: mise run slides-all
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
