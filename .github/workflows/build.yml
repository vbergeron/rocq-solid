name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rocq:
    name: Rocq proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `mise run build` runs dune in the rocq/rocq-prover image (the default
      # ROCQ_BACKEND), exactly as it does locally; no tool to install.
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Check the proofs
        env:
          MISE_TASK_RUN_AUTO_INSTALL: false
        run: mise run build
      - name: Generated opam file is up to date
        run: git diff --exit-code -- rocq-solid.opam

  slides:
    name: Slides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: typst
      - name: Compile all decks
        run: mise run slides-all
      - uses: actions/upload-artifact@v4
        with:
          name: decks
          path: site/decks/*.pdf
