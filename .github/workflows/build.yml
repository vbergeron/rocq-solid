name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rocq:
    name: Rocq proofs
    # Skipped while iterating on the talk; run it by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Prebuilt Rocq instead of `mise run setup`, which compiles Rocq from
    # source. The image's opam switch belongs to its uid 1000 user, but
    # actions/checkout needs root: run as root, build as that user.
    container:
      image: rocq/rocq-prover:9.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: dune build
        run: |
          user="$(getent passwd 1000 | cut -d: -f1)"
          chown -R "$user" "$GITHUB_WORKSPACE"
          su "$user" -s /bin/bash -c "cd '$GITHUB_WORKSPACE' && eval \"\$(opam env)\" && rocq --version && dune build"
      - name: Generated opam file is up to date
        run: git -c safe.directory='*' diff --exit-code -- rocq-solid.opam

  slides:
    name: Slides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: typst
      - name: Compile all decks
        run: mise run slides-all
      - uses: actions/upload-artifact@v4
        with:
          name: decks
          path: site/decks/*.pdf

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [slides]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: typst
      - name: Compile decks into the site
        run: mise run slides-all
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
