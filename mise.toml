[tools]
typst = "latest"
opam = "2.4"

[vars]
deck = "decks/rocq-solid.typ"
ocaml = "5.3.0"

# ---------------------------------------------------------------- Rocq ----

[tasks.setup]
description = "Create the local opam switch (_opam/) with OCaml, dune and Rocq"
run = '''
[ -d "${OPAMROOT:-$HOME/.opam}" ] || opam init --bare --no-setup --yes
if [ -d _opam ]; then
  opam install --switch=. --deps-only --yes .
else
  opam switch create . "{{vars.ocaml}}" --deps-only --yes
fi
'''

[tasks.build]
description = "Check every proof under theories/"
run = "opam exec --switch=. -- dune build"

[tasks.clean]
description = "Remove dune's build directory"
run = "opam exec --switch=. -- dune clean"

[tasks.shell]
description = "Print the environment of the local switch (eval \"$(mise run shell)\")"
quiet = true
run = "opam env --switch=. --set-switch"

# -------------------------------------------------------------- Slides ----

[tasks.slides]
description = "Compile a deck to <stem>.pdf"
usage = 'arg "[file]" default="{{vars.deck}}"'
run = 'typst compile --root . "${usage_file}" "$(basename "${usage_file%.typ}").pdf"'

[tasks.watch]
description = "Live-recompile a deck while editing"
usage = 'arg "[file]" default="{{vars.deck}}"'
run = 'typst watch --root . "${usage_file}" "$(basename "${usage_file%.typ}").pdf"'

[tasks.slides-all]
description = "Compile every deck into site/decks/"
run = '''
mkdir -p site/decks
for f in decks/*.typ; do
  typst compile --root . "$f" "site/decks/$(basename "${f%.typ}").pdf"
done
'''
