[tools]
typst = "latest"
opam = "2.4"

[env]
# docker: run Rocq in ROCQ_IMAGE (the image CI uses, nothing to build)
# opam:   run Rocq from a local opam switch in _opam/ (`mise run setup`)
ROCQ_BACKEND = "{{ get_env(name='ROCQ_BACKEND', default='docker') }}"
ROCQ_IMAGE = "rocq/rocq-prover:9.1"

[vars]
deck = "decks/rocq-solid.typ"
ocaml = "5.3.0"

# ---------------------------------------------------------------- Rocq ----

[tasks.setup]
description = "Pull the Rocq image, or create the local opam switch (ROCQ_BACKEND=opam)"
run = '''
if [ "$ROCQ_BACKEND" = docker ]; then
  docker pull "$ROCQ_IMAGE"
elif [ -d _opam ]; then
  opam install --switch=. --deps-only --yes .
else
  [ -d "${OPAMROOT:-$HOME/.opam}" ] || opam init --bare --no-setup --yes
  opam switch create . "{{vars.ocaml}}" --deps-only --yes
fi
'''

[tasks.rocq]
description = "Run a command with Rocq and dune on PATH, e.g. `mise run rocq rocq top`"
file = "scripts/rocq"

[tasks.build]
description = "Check every proof under theories/"
run = "scripts/rocq dune build"

[tasks.clean]
description = "Remove dune's build directory"
run = "scripts/rocq dune clean"

# -------------------------------------------------------------- Slides ----

[tasks.slides]
description = "Compile a deck to <stem>.pdf"
usage = 'arg "[file]" default="{{vars.deck}}"'
run = 'typst compile --root . "${usage_file}" "$(basename "${usage_file%.typ}").pdf"'

[tasks.watch]
description = "Live-recompile a deck while editing"
usage = 'arg "[file]" default="{{vars.deck}}"'
run = 'typst watch --root . "${usage_file}" "$(basename "${usage_file%.typ}").pdf"'

[tasks.slides-all]
description = "Compile every deck into site/decks/"
run = '''
mkdir -p site/decks
for f in decks/*.typ; do
  typst compile --root . "$f" "site/decks/$(basename "${f%.typ}").pdf"
done
'''
